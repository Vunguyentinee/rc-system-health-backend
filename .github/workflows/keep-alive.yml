name: Keep Render backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend to prevent Render free-tier sleep
        run: curl -fsS "https://recommend-system-food-excercise.onrender.com/" -o /dev/null
